name = "dastak"
main = "worker/index.js"
compatibility_date = "2024-09-30"

[vars]
GITHUB_OWNER = "digitalprint077-lang"
GITHUB_REPO = "dastak"
GITHUB_BRANCH = "main"

[[d1_databases]]
binding = "Dastak_binding"
database_name = "dastak-certs"
database_id = "826b4b2c-ac55-4b95-a2f1-9782f44c0dbe"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Deploy: npm run build && npx wrangler deploy
# Cloudflare Pages → Build command must include wrangler deploy (see .env.example).
