name = "dastak"
main = "worker/index.js"
compatibility_date = "2024-09-30"

[vars]
GITHUB_OWNER = "digitalprint077-lang"
GITHUB_REPO = "dastak"
GITHUB_BRANCH = "main"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Deploy: npm run build && npx wrangler deploy
# Cloudflare Pages → Build command must include wrangler deploy (see .env.example).
