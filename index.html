<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" value="notranslate" />
    <meta name="theme-color" content="#464dee" />
    <title>Dastak - Citizens platform</title>
    <link rel="icon" href="/images/kp-logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var path = location.pathname.replace(/\/$/, "") || "/";
        if (/^\/vehiclefitness\/[^/]+\/print$/i.test(path)) {
          document.documentElement.classList.add("skip-app-loader");
        }
      })();
    </script>
    <style>
      html.skip-app-loader #app-loader {
        display: none !important;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5f7;
      }

      #app-loader .dastak-loader-inner {
        position: relative;
        width: 96px;
        height: 96px;
        flex-shrink: 0;
      }

      #app-loader .dastak-loader-ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #app-loader .dastak-loader-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 52px !important;
        height: auto !important;
        max-width: 52px !important;
        max-height: 52px !important;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="app-loader" class="dastak-loader" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Dastak">
      <div class="dastak-loader-inner">
        <svg class="dastak-loader-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="dastak-loader-track" cx="50" cy="50" r="44" fill="none" stroke="#eef0f6" stroke-width="3" />
          <circle class="dastak-loader-arc" cx="50" cy="50" r="44" fill="none" stroke="#464dee" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 206" />
        </svg>
        <img class="dastak-loader-logo" src="/images/logo-dastak.png" alt="" width="52" height="52" decoding="async" />
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
